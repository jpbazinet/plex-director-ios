# Cloud build for the Plex Director iOS shell. No Mac needed.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Plex Director ASC   # the name you give the API key in Codemagic → Teams → Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jpbazinet.plexdirector
      vars:
        BUNDLE_ID: com.jpbazinet.plexdirector
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install and create the native project
        script: |
          npm install
          npx cap add ios
          npx cap sync ios
          sh prepare-ios.sh
      - name: Set up signing
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"   # Codemagic's own counter; unique per build
      - name: Build the .ipa
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal
