# Cloud build for the Plex Director iOS shell. No Mac needed.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Plex Director ASC   # the name you give the API key in Codemagic → Teams → Integrations
    environment:
      groups:
        - signing   # holds CERTIFICATE_PRIVATE_KEY (Codemagic → app → Environment variables)
      vars:
        BUNDLE_ID: com.jpbazinet.plexdirectorapp
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install and create the native project
        script: |
          npm install
          mkdir -p www && { [ -f www/index.html ] || cp index.html www/index.html; }   # the web folder Capacitor expects
          npx cap add ios
          npx cap sync ios
          sh prepare-ios.sh
      - name: Fetch signing files from Apple (creates cert + profile if missing; shows the real error if it can't)
        script: |
          keychain initialize
          # The distribution certificate belongs to this RSA key (a Codemagic secret), so the same certificate is reused every build.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"   # Codemagic's own counter; unique per build
      - name: Build the .ipa
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true   # internal testers get every build automatically; no group assignment needed
